# Local Postgres for development and for the Go store suites.
#
# The store suites prefer a testcontainer, and fall back to TEST_DATABASE_URL.
# In a sandbox with no container runtime at all, tools/test-db-local.sh boots a
# system Postgres instead and prints that variable.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: binder
      POSTGRES_PASSWORD: binder
      POSTGRES_DB: binder
    ports:
      - '5432:5432'
    volumes:
      - binderdb:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U binder -d binder']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  binderdb:
    driver: local
